[project]
name = "neware-sql"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kristian Fredrik Klepp Thorbjørnsen", email = "kthorbjornsen@corvusenergy.com" }
]
requires-python = ">=3.11"
dependencies = [
    "adlfs>=2026.8.0",
    "pandas>=3.0.4",
    "polars",
    "pyarrow>=24.0.0",
    "pymysql>=1.2.0",
    "sqlalchemy",
]

[project.scripts]
neware-sql = "newaresql:main"

[project.optional-dependencies]
examples = [
    "dotenv>=0.9.9",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "plotly>=7.1.0",
]

[build-system]
requires = ["uv_build>=0.10.5,<0.11.0"]
build-backend = "uv_build"


[tool.uv.build-backend]
module-name = "newaresql"
